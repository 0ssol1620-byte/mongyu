name: Standalone Android QA
on:
  workflow_dispatch:
  push:
    branches: [main, codex/r103-stage-polish]
    paths-ignore: ['docs/**', 'evidence/**', 'README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'evidence/**', 'README.md']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate standalone game
        run: python3 scripts/test.py
  playable:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/r103-stage-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build actual R102 and current R103 with disposable certificate
        run: |
          git fetch --no-tags --depth=1 origin 8372e7cbd77b3d359f443bf2d53f2d28a73d942d
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 scripts/build-playable-qa.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 4
          script: node tools/verify-r103-android.cjs ci/baseline.apk ci/updated.apk
      - name: Device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r103-device-evidence
          path: ci/device/
      - name: Tested standalone unsigned APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r103-verified-unsigned
          path: android/outputs/MONGYU_R103_TEST_DEBUG_UNSIGNED.apk
