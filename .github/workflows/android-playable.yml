name: Standalone Android QA
on:
  workflow_dispatch:
  push:
    branches: [codex/r94-play-without-files]
    paths-ignore: ['docs/**', 'evidence/**', 'README.md']
permissions:
  contents: read
jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Validate standalone game
        run: python3 scripts/test.py
      - name: Build actual R93 and current R94 with disposable certificate
        run: |
          git fetch --no-tags --depth=1 origin e4f42e529a71fe30532021cc21b6a72e256dfa9d
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 scripts/build-playable-qa.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 4
          script: node tools/verify-r94-android.cjs ci/baseline.apk ci/updated.apk
      - name: Device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r94-device-evidence
          path: ci/device/
      - name: Tested standalone unsigned APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r94-verified-unsigned
          path: android/outputs/MONGYU_R94_TEST_DEBUG_UNSIGNED.apk
