name: Original-file Android QA
on:
  workflow_dispatch:
  push:
    branches: [codex/r93-original-player]
    paths-ignore: ['docs/**', 'evidence/**', 'README.md']
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify player containers, save journal and packaged assets
        run: python3 scripts/test.py
      - name: Fetch separately configured private QA reference
        env:
          MONGYU_ORIGINAL_QA_URL: ${{ secrets.MONGYU_ORIGINAL_QA_URL }}
        run: python3 scripts/fetch-original-qa.py
      - name: Prepare SDK and disposable QA packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python3 scripts/build-device-qa.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -no-audio -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none -memory 3072 -cores 4
          script: node tools/verify-original-android.cjs ci/baseline.apk ci/updated.apk ci/private-original/original.zip
      - name: Metadata-only device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-device-evidence
          path: ci/device/android-report.json
      - name: Tested host APK without commercial game data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-original-host
          path: android/outputs/MONGYU_R93_TEST_DEBUG_UNSIGNED.apk
      - name: Remove private QA input
        if: always()
        run: rm -rf ci/private-original
