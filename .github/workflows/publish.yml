name: Publish verified R87 preview
on:
  push:
    branches: [codex/r87-preview-artifacts]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact signed payload and source archive
        run: sha256sum -c MONGYU_R87_SHA256SUMS.txt
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create r87-preview
          --prerelease
          --target ae8961d0f5f714271f7c7446135ad37f0b67be60
          --title '몽유 R87 · Android 테스트'
          --notes-file RELEASE_NOTES.md
          MONGYU_R87_ANDROID.apk MONGYU_R87_source.zip MONGYU_R87_SHA256SUMS.txt
