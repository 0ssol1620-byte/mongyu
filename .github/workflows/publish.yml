name: Publish verified R92 preview
on:
  push:
    branches: [codex/r92-preview-artifacts]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact signed payload and source archive
        run: sha256sum -c MONGYU_R92_SHA256SUMS.txt
      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create r92-preview
          --prerelease
          --target b44a6765e62b762e70b3967a2ae30405fa660a2c
          --title '몽유 R92 · 이전 모드 정리·캐릭터·녹음 음악'
          --notes-file RELEASE_NOTES.md
          MONGYU_R92_ANDROID.apk MONGYU_R92_source.zip MONGYU_R92_SHA256SUMS.txt MONGYU_R92_PLAY_WITH_SOUND.webm
